name: Publish web app

# Every change under www/ goes live at https://manorkeshet417-code.github.io/yomi/
# and the Android app picks it up on its next launch, with no new APK.
on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir _site
          cp -r www/. _site/
          # index.html is written without a doctype (the Claude preview adds its own); browsers need one for standards mode
          sed -i '1i <!doctype html>' _site/index.html
          # a new cache name per commit, so phones drop the old copy
          sed -i "s/yomi-v1/yomi-${GITHUB_SHA::8}/" _site/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

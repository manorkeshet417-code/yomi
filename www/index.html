<title>יומי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: iOS-style app. Content layer = inset grouped lists on a grouped background.
   Functional layer = Liquid Glass (floating tab bar, navigation bar once scrolled, sheets, HUD).
   Each role sets the tint; on wide screens the app runs inside an iPhone frame. */
:root{
  --bg:#f2f2f7; --bg2:#ffffff; --bg3:#e9e9ee; --label:#000000; --label2:#6c6c70; --label3:#8e8e93;
  --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.16); --fill2:rgba(120,120,128,.1);
  --glass:rgba(250,250,252,.72); --glass-edge:rgba(255,255,255,.75); --glass-shadow:0 10px 30px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);
  --scrim:rgba(0,0,0,.28); --desk:#d8d8de; --bezel:#1c1c1e; --island:#000000;
  --calc-key:#ffffff; --calc-fn:#d1d1d6; --calc-fn-ink:#000000;
  --dev:#0066cc; --design:#d30f45; --teach:#248a3d; --parent:#c93400;
  --accent:var(--dev); --on-accent:#ffffff; --red:#d70015; --ok:#248a3d;
  --c-blue:#0a84ff; --c-orange:#ff9500; --c-purple:#af52de; --c-indigo:#5856d6; --c-pink:#ff2d55; --c-gray:#8e8e93;
  --c-teal:#30b0c7; --c-red:#ff3b30; --c-green:#34c759; --c-yellow:#ff9f0a; --c-brown:#a2845e; --c-mint:#00c7be;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo","Segoe UI",Roboto,system-ui,sans-serif;
  --font-num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Heebo",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --r-list:26px; --r-widget:24px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg2:#1c1c1e; --bg3:#2c2c2e; --label:#ffffff; --label2:#aeaeb2; --label3:#8e8e93;
    --sep:rgba(84,84,88,.65); --fill:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.24);
    --glass:rgba(38,38,42,.62); --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 10px 30px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.5); --desk:#0b0b0d; --bezel:#2c2c30;
    --calc-key:#333336; --calc-fn:#a5a5a5; --calc-fn-ink:#000000;
    --dev:#0a84ff; --design:#ff375f; --teach:#30d158; --parent:#ff9f0a;
    --on-accent:#000000; --red:#ff453a; --ok:#30d158; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#1c1c1e; --bg3:#2c2c2e; --label:#ffffff; --label2:#aeaeb2; --label3:#8e8e93;
  --sep:rgba(84,84,88,.65); --fill:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.24);
  --glass:rgba(38,38,42,.62); --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 10px 30px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.5); --desk:#0b0b0d; --bezel:#2c2c30;
  --calc-key:#333336; --calc-fn:#a5a5a5; --calc-fn-ink:#000000;
  --dev:#0a84ff; --design:#ff375f; --teach:#30d158; --parent:#ff9f0a;
  --on-accent:#000000; --red:#ff453a; --ok:#30d158; color-scheme:dark;
}
:root[data-role="design"]{--accent:var(--design)}
:root[data-role="teach"]{--accent:var(--teach)}
:root[data-role="parent"]{--accent:var(--parent)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:var(--label)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}

/* ---------- iPhone frame (wide screens only, never inside the Android app) ---------- */
.statusbar,.stage-note{display:none}
@media (min-width:600px) and (min-height:640px){
  :root:not(.native) body{background:var(--desk)}
  :root:not(.native) body::before{display:none}
  :root:not(.native) .stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px}
  :root:not(.native) .phone{position:relative;transform:translateZ(0);width:393px;max-width:100%;height:min(852px,calc(100vh - 90px));border:12px solid var(--bezel);border-radius:60px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 2px color-mix(in srgb,var(--bezel) 60%,var(--label3)),0 40px 80px -30px rgba(0,0,0,.5)}
  :root:not(.native) .statusbar{display:flex;flex:none;justify-content:space-between;align-items:center;height:50px;padding:6px 32px 0;font-family:var(--font-num);font-weight:600;font-size:16px;position:absolute;inset:0 0 auto;z-index:30;pointer-events:none}
  :root:not(.native) .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:122px;height:36px;border-radius:20px;background:var(--island);z-index:40}
  :root:not(.native) .screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
  :root:not(.native) .screen::-webkit-scrollbar{display:none}
  :root:not(.native) .navbar{top:0;padding-top:50px}
  :root:not(.native) #app.no-tabs{padding-top:50px}
  :root:not(.native) .stage-note{display:block;color:var(--label2);font-size:13px;text-align:center;max-width:393px}
}
.island{display:none}
@media (min-width:600px) and (min-height:640px){:root:not(.native) .island{display:block}}
.sb-icons{display:flex;gap:6px;align-items:center}

#app{max-width:520px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
#app.no-tabs{padding-bottom:40px}

/* ---------- navigation bar + large title ---------- */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(8px,env(safe-area-inset-left,0px));transition:background-color .2s,box-shadow .2s}
.nb-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:48px}
.nb-title{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.navbar.inline .nb-title,.navbar.scrolled .nb-title{opacity:1}
.navbar.scrolled{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 .5px 0 var(--sep)}
.nb-lead{justify-self:start;display:flex}
.nb-trail{justify-self:end;display:flex;gap:4px}
.nb-btn{display:inline-flex;align-items:center;gap:2px;min-height:44px;min-width:44px;padding:0 8px;color:var(--accent);font-size:17px;border-radius:22px}
.nb-btn:active{opacity:.4}
.nb-btn.bold{font-weight:600}
.large{padding:2px 4px 14px}
.large h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:13px;font-weight:600;color:var(--label2)}

/* ---------- inset grouped lists ---------- */
.section-h{font-size:13px;color:var(--label2);padding:20px 16px 7px;font-weight:500}
.section-h:first-child{padding-top:4px}
.section-f{font-size:13px;color:var(--label2);padding:7px 16px 0;line-height:1.35}
.list{background:var(--bg2);border-radius:var(--r-list);overflow:hidden}
.list>*{position:relative}
.list>*+*::after{content:"";position:absolute;top:0;inset-inline-start:var(--inset,16px);inset-inline-end:0;height:1px;transform:scaleY(.5);transform-origin:top;background:var(--sep);z-index:3;pointer-events:none}
.list.icons{--inset:58px}
.list.checks{--inset:52px}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;width:100%;background:var(--bg2)}
button.row:active,.row.tap:active{background:var(--fill2)}
.row .body{flex:1;min-width:0}
.row .t{font-size:17px;overflow-wrap:anywhere}
.row .sub{font-size:13px;color:var(--label2);margin-top:2px;overflow-wrap:anywhere}
.row .val{color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--label3);flex:none}
.row.blue{color:var(--accent);justify-content:center}
.row.red{color:var(--red);justify-content:center}
.sq{--c:var(--c-blue);width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c))}
.sq.lg{width:56px;height:56px;border-radius:14px}
.sq.xl{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--c) 60%,transparent)}
.tag{font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--fill);color:var(--label2);margin-inline-start:6px;vertical-align:2px;display:inline-block}

/* reminders-style check */
.check{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--label3);display:grid;place-items:center;color:transparent;transition:background-color .15s,border-color .15s}
.check svg{transform:scale(.6);transition:transform .2s}
.done .check{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.done .check svg{transform:scale(1)}
.done .t{color:var(--label2);text-decoration:line-through;text-decoration-color:var(--label3)}

/* swipe to delete + edit mode */
.swipe{padding:0;overflow:hidden;background:var(--bg2)}
form{margin:0}
.sw-c{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;background:var(--bg2);position:relative;z-index:1;touch-action:pan-y;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sw-c.drag{transition:none}
.swipe-del{position:absolute;inset:0 auto 0 0;width:88px;background:var(--red);color:#fff;font-weight:600;font-size:15px;display:grid;place-items:center}
.swipe-del{visibility:hidden}
.swipe.open .swipe-del,.swipe:has(.sw-c.drag) .swipe-del{visibility:visible}
.swipe.open .sw-c{transform:translateX(88px)}
.minus{display:none;width:24px;height:24px;flex:none;border-radius:50%;background:var(--red);color:#fff;place-items:center}
.editing .minus{display:grid}
.editing .check{display:none}

/* inline add rows & fields */
.add-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 16px;background:var(--bg2)}
.add-row .plus{width:26px;height:26px;flex:none;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.add-row input{flex:1;min-width:0;border:0;background:none;font-size:17px;min-height:40px;outline:none}
.add-row input::placeholder,.field input::placeholder,.field textarea::placeholder{color:var(--label3)}
.field{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 16px;background:var(--bg2)}
.field label{flex:none;min-width:88px;font-size:17px}
.field input,.field textarea,.field select{flex:1;min-width:0;border:0;background:none;font-size:17px;min-height:40px;outline:none;padding:0}
.field textarea{padding:8px 0;resize:none;line-height:1.35}
.field.stack{flex-direction:column;align-items:stretch;gap:2px;padding-top:10px}
.field.stack label{font-size:13px;color:var(--label2);font-weight:500}
.mono{font-family:var(--font-mono);font-size:15px}

/* buttons (capsules) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 22px;border-radius:999px;font-size:17px;font-weight:600;background:var(--fill);color:var(--label)}
.btn:active{opacity:.6}
.btn.filled{background:var(--accent);color:var(--on-accent)}
.btn.tinted{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.btn.sm{min-height:36px;padding:0 14px;font-size:15px}
.btn.block{width:100%}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row>.btn{flex:1}
.icon-btn{width:44px;height:44px;flex:none;display:inline-grid;place-items:center;border-radius:50%;color:var(--accent)}
.icon-btn:active{background:var(--fill2)}

/* ---------- floating Liquid Glass tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:0 max(20px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));pointer-events:none}
.tabbar::before{content:"";position:absolute;inset:-30px 0 0;background:linear-gradient(to top,var(--bg) 20%,transparent);pointer-events:none;opacity:.9}
.tb-in{position:relative;pointer-events:auto;max-width:360px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:5px;border-radius:999px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:999px;color:var(--label);font-size:11px;font-weight:600;min-height:54px;justify-content:center}
.tab.on{color:var(--accent);background:var(--fill2)}

/* ---------- home widgets ---------- */
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.widget{background:var(--bg2);border-radius:var(--r-widget);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:150px;text-align:start}
button.widget:active{transform:scale(.98)}
.widget .w-h{font-size:13px;font-weight:600;color:var(--label2);display:flex;align-items:center;gap:6px}
.widget .w-big{font-family:var(--font-num);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.widget .w-sub{font-size:13px;color:var(--label2);margin-top:auto}
.ring-w{display:flex;align-items:center;gap:12px}
.ring-w svg{flex:none}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px 0}
.shortcut{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-align:center;color:var(--label)}
.shortcut:active .sq{filter:brightness(.85)}
.tip{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--bg2);border-radius:var(--r-list);font-size:15px;line-height:1.4}

/* ---------- onboarding ---------- */
.onb{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:28px;gap:10px}
.onb h1{font-size:34px;font-weight:800;line-height:1.15;margin-top:8px}
.onb .lead{color:var(--label2);font-size:17px;max-width:30ch}
.features{display:flex;flex-direction:column;gap:18px;margin:26px 8px 6px;text-align:start}
.feature{display:flex;gap:14px;align-items:flex-start}
.feature .fi{width:40px;flex:none;color:var(--accent);display:grid;place-items:center}
.feature b{display:block;font-size:15px}
.feature span{font-size:15px;color:var(--label2);line-height:1.35}
.err{color:var(--red);font-size:13px;padding:7px 16px 0}
.loading{display:grid;place-items:center;min-height:70vh}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--label2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- timer (Clock style) ---------- */
.t-face{position:relative;width:min(280px,76vw);max-width:100%;aspect-ratio:1;margin:6px auto 0}
.t-face>svg{width:100%;height:100%;transform:rotate(-90deg)}
.t-arc{transition:stroke-dashoffset .3s linear}
.t-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:4px}
.t-time{font-family:var(--font-num);font-size:64px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.t-label{font-size:15px;color:var(--label2);font-weight:500}
.t-end{font-size:13px;color:var(--label2);display:flex;gap:4px;align-items:center;justify-content:center}
.clock-btns{display:flex;justify-content:space-between;padding:6px 6px 0}
.cbtn{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:500;box-shadow:0 0 0 2px var(--bg),0 0 0 4px currentColor}
.cbtn.gray{background:var(--fill);color:var(--label);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fill)}
.cbtn.go{background:color-mix(in srgb,var(--accent) 22%,var(--bg2));color:var(--accent)}
.cbtn.stop{background:color-mix(in srgb,var(--c-orange) 22%,var(--bg2));color:var(--parent)}
.cbtn:active{opacity:.7}
.preset-t{font-family:var(--font-num);font-size:30px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;min-width:62px}
.playc{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

/* ---------- tools ---------- */
.code{font-family:var(--font-mono);font-size:13px;background:var(--fill2);border-radius:10px;padding:10px 12px;margin-top:6px;white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left}
.msg{font-size:13px;font-weight:600;padding:7px 16px 0}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--red)}
.palette{display:flex;flex-direction:column;border-radius:var(--r-list);overflow:hidden}
.sw{display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-height:84px}
.sw-hex{font-family:var(--font-mono);font-size:17px;font-weight:600;direction:ltr;min-height:44px}
.sw-lock{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;opacity:.6}
.sw-lock[aria-pressed="true"]{opacity:1;background:rgba(127,127,127,.22)}
.well{width:30px;height:30px;flex:none;border-radius:50%;border:0;padding:0;overflow:hidden;background:none;box-shadow:0 0 0 .5px var(--sep)}
.well::-webkit-color-swatch-wrapper{padding:0}
.well::-webkit-color-swatch{border:0;border-radius:50%}
.well::-moz-color-swatch{border:0;border-radius:50%}
.preview{border-radius:var(--r-list);padding:18px;display:flex;flex-direction:column;gap:6px}
.preview .lg-txt{font-size:24px;font-weight:700}
.ratio{font-family:var(--font-num);font-size:48px;font-weight:600;direction:ltr;display:inline-block;line-height:1;font-variant-numeric:tabular-nums}
.pass{color:var(--ok);font-weight:600} .fail{color:var(--red);font-weight:600}
.pick-card{background:var(--bg2);border-radius:var(--r-list);padding:26px 16px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.pick-name{font-size:36px;font-weight:800;color:var(--accent);min-height:44px;line-height:1.2}
.stepper{display:inline-flex;background:var(--fill);border-radius:10px;overflow:hidden}
.stepper button{width:48px;height:34px;display:grid;place-items:center;font-size:22px;font-weight:400}
.stepper button+button{border-inline-start:.5px solid var(--sep)}
.stepper button:active{background:var(--fill)}
.big-num{font-family:var(--font-num);font-size:64px;font-weight:600;color:var(--accent);line-height:1.05;font-variant-numeric:tabular-nums}
.grade-row{display:grid;grid-template-columns:24px 1fr 58px 58px;gap:8px;align-items:center;min-height:52px;padding:4px 16px;background:var(--bg2)}
.grade-row input{border:0;background:var(--fill2);border-radius:8px;min-height:36px;padding:0 8px;font-size:16px;min-width:0;width:100%}
.grade-row input.nm{background:none;padding:0}
.grade-h{display:grid;grid-template-columns:24px 1fr 58px 58px;gap:8px;padding:0 16px 7px;font-size:13px;color:var(--label2)}
.stars{display:inline-flex;align-items:center;gap:3px;color:var(--c-yellow);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.stars svg{fill:currentColor}
.meal .day{min-width:70px;flex:none;font-size:17px}
.meal.today .day{color:var(--accent);font-weight:600}
.today-dot{display:inline-block;font-size:11px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:6px;padding:1px 6px;margin-inline-start:4px;vertical-align:2px}

/* ---------- calculator ---------- */
.calc-disp{direction:ltr;text-align:right;padding:8px 8px 14px;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.calc-expr{font-family:var(--font-num);font-size:20px;color:var(--label2);min-height:26px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc-num{font-family:var(--font-num);font-weight:300;font-size:72px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.keys{direction:ltr;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 2px}
.key{aspect-ratio:1;border-radius:50%;font-family:var(--font-num);font-size:32px;display:grid;place-items:center;background:var(--calc-key);color:var(--label);transition:filter .12s,background-color .2s,color .2s}
.key:active{filter:brightness(1.3)}
.key.fn{background:var(--calc-fn);color:var(--calc-fn-ink);font-size:26px;font-weight:500}
.key.op{background:var(--c-orange);color:#fff;font-size:36px}
.key.op.on{background:#fff;color:var(--c-orange);box-shadow:inset 0 0 0 1px var(--sep)}
.key.zero{grid-column:span 2;aspect-ratio:auto;border-radius:999px;justify-items:start;padding-left:30px}

/* ---------- notes, habits, countdowns, split ---------- */
.note-meta{text-align:center;font-size:13px;color:var(--label2);padding:2px 0 10px}
.note-ed{width:100%;min-height:58vh;border:0;background:none;font-size:17px;line-height:1.5;resize:none;outline:none;padding:0 4px;color:var(--label)}
.days{display:flex;gap:6px;margin-top:10px}
.dayc{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--fill2);color:var(--label2)}
.dayc.on{background:var(--accent);color:var(--on-accent)}
.dayc.today{box-shadow:0 0 0 2px var(--bg2),0 0 0 3.5px var(--accent)}
.flame{display:inline-flex;align-items:center;gap:3px;color:var(--c-orange);font-weight:700}
.cd-n{font-family:var(--font-num);font-size:28px;font-weight:600;color:var(--accent);text-align:center;min-width:64px;line-height:1;font-variant-numeric:tabular-nums}
.cd-n.past{color:var(--label3)}
.cd-u{display:block;font-family:var(--font);font-size:12px;color:var(--label2);font-weight:500;margin-top:3px}
.seg{display:flex;background:var(--fill2);border-radius:9px;padding:2px;gap:2px;width:100%}
.seg button{flex:1;min-height:32px;border-radius:7px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--bg2);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.field input[type=date]{text-align:start}

/* ---------- sheets & HUD ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.asheet{position:fixed;left:0;right:0;bottom:0;z-index:51;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto}
.asheet.show{transform:none}
.ag{border-radius:22px;overflow:hidden}
.am{padding:16px 18px;text-align:center;font-size:13px;color:var(--label2);line-height:1.4}
.am b{display:block;color:var(--label);font-size:15px;margin-bottom:3px}
.aa{display:block;width:100%;min-height:58px;font-size:20px;text-align:center;color:var(--accent);border-top:.5px solid var(--sep)}
.aa.destructive{color:var(--red)}
.aa.cancel{border:0;font-weight:600;border-radius:22px}
.aa:active{background:var(--fill2)}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;z-index:60;transform:translate(-50%,-160%) scale(.9);transition:transform .45s cubic-bezier(.2,1.2,.3,1),opacity .2s;opacity:0;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;min-height:48px;border-radius:999px;font-size:15px;font-weight:600;max-width:calc(100% - 32px);background:#1c1c1e;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3)}
@media (min-width:600px) and (min-height:640px){:root:not(.native) .hud{top:6px}}
.hud.show{transform:translate(-50%,0) scale(1);opacity:1}
.hud .hud-ic{color:#30d158;display:grid}
.hud button{color:#0a84ff;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12)}

/* ---------- motion ---------- */
@keyframes push{from{transform:translateX(-28%);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateX(18%);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.anim-push{animation:push .34s cubic-bezier(.2,.9,.25,1)}
.anim-pop{animation:pop .3s cubic-bezier(.2,.9,.25,1)}
.anim-fade{animation:fade .2s ease-out}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (prefers-reduced-transparency: reduce),(prefers-contrast: more){
  .glass,.navbar.scrolled{background:var(--bg2);-webkit-backdrop-filter:none;backdrop-filter:none}
  .glass{border-color:var(--sep)}
}

<script>
(function(){
'use strict';
const root=document.documentElement; root.lang='he'; root.dir='rtl';
if(window.Capacitor)root.classList.add('native');

const clone=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const haptic=p=>{try{navigator.vibrate&&navigator.vibrate(p||8)}catch(e){}};

/* ---------- datastore ----------
   cloud: the artifact's db, one private document per key under data/users/<id>/ (synced across devices)
   local: localStorage on this device, one namespace per local account (used in the Android app) */
const LS={
  get(k){try{const v=localStorage.getItem(k);return v===null?undefined:JSON.parse(v)}catch(e){return undefined}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}},
  keys(){try{return Object.keys(localStorage)}catch(e){return []}}
};
const STATUS={ok:'מסונכרן',saving:'שומר…',offline:'אין חיבור',error:'שגיאה',local:'במכשיר'};
const db={
  mode:'local',acct:null,uid:null,cloud:null,cache:{},pending:{},busy:{},timers:{},status:'local',offline:false,
  get(k,d){return k in this.cache?clone(this.cache[k]):d},
  set(k,v){this.cache[k]=clone(v);this.persist(k)},
  remove(k){delete this.cache[k];this.persist(k)},
  lk(k){return 'yomi.'+this.acct+'.'+k},
  persist(k){
    if(this.mode==='cloud'){this.pending[k]=1;setStatus('saving');clearTimeout(this.timers[k]);this.timers[k]=setTimeout(()=>this.flush(k),400);return}
    if(!this.acct)return;
    if(k in this.cache)LS.set(this.lk(k),this.cache[k]);else LS.del(this.lk(k));
  },
  ref(k){return this.cloud.doc('data/users/'+this.uid+'/'+k)},
  async write(k){const r=this.ref(k);if(k in this.cache)await r.set({v:clone(this.cache[k]),at:Date.now()});else await r.delete()},
  async flush(k){
    if(this.mode!=='cloud')return;
    if(this.busy[k]){clearTimeout(this.timers[k]);this.timers[k]=setTimeout(()=>this.flush(k),300);return}
    this.busy[k]=1;delete this.pending[k];
    try{await this.write(k);this.offline=false}
    catch(e){
      if(e&&e.code==='unavailable'){await sleep(400+Math.random()*800);try{await this.write(k);this.offline=false}catch(e2){this.fail(e2)}}
      else this.fail(e);
    }
    delete this.busy[k];refreshStatus();
  },
  fail(e){
    const c=e&&e.code;
    if(c==='quota_exceeded'){hud('נגמר המקום במאגר. מחקו פריטים ישנים.',{icon:'warn'});return}
    if(['invalid_argument','not_granted','revoked','capability_disabled','capability_removed'].indexOf(c)>-1){
      hud('אין הרשאה לענן כאן. שומרים במכשיר.',{icon:'warn'});toLocal();return}
    this.offline=true;
  },
  async wipeAll(){
    const keys=Object.keys(this.cache);this.cache={};
    if(this.mode==='cloud'){for(const k of keys){clearTimeout(this.timers[k]);this.pending[k]=1}for(const k of keys)await this.flush(k);return}
    keys.forEach(k=>LS.del(this.lk(k)));
    LS.set('yomi.accounts',(LS.get('yomi.accounts')||[]).filter(a=>a.id!==this.acct));LS.del('yomi.current');this.acct=null;
  }
};
function setStatus(s){db.status=s;document.querySelectorAll('.sync').forEach(el=>{el.textContent=STATUS[s];el.style.color=s==='ok'?'var(--ok)':(s==='offline'||s==='error')?'var(--red)':''})}
function refreshStatus(){
  if(db.mode!=='cloud')return setStatus('local');
  if(Object.keys(db.pending).length||Object.keys(db.busy).length)return setStatus('saving');
  setStatus(db.offline?'offline':'ok');
}
const localAccounts=()=>LS.get('yomi.accounts')||[];
function useLocal(id){
  db.acct=id;LS.set('yomi.current',id);db.cache={};
  const p='yomi.'+id+'.';LS.keys().forEach(k=>{if(k.indexOf(p)===0){const v=LS.get(k);if(v!==undefined)db.cache[k.slice(p.length)]=v}});
}
function createLocal(name){const id='a'+Date.now().toString(36);const a=localAccounts();a.push({id:id,name:name});LS.set('yomi.accounts',a);useLocal(id)}
function toLocal(){
  const data=db.cache;if(unsub){try{unsub()}catch(e){}unsub=null}
  db.mode='local';db.pending={};db.busy={};
  createLocal((data.user&&data.user.name)||'חשבון');Object.keys(data).forEach(k=>db.set(k,data[k]));
  refreshStatus();applyState();render();
}

const T0=()=>({total:1500,left:1500,running:false,endAt:0,label:'פוקוס'});
let T=T0(),lastT='',tick=null,actx=null,unsub=null,needRender=false,anim='';

const first=n=>String(n||'').trim().split(/\s+/)[0];
const greet=()=>{const h=new Date().getHours();return h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<22?'ערב טוב':'לילה טוב'};
const today=()=>new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const hhmm=t=>{const d=new Date(t);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;const p=n=>String(n).padStart(2,'0');return h?`${h}:${p(m)}:${p(x)}`:`${p(m)}:${p(x)}`};
const remain=()=>T.total?T.left/T.total:0;

const typing=()=>{const a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
const isFrame=()=>getComputedStyle(screenEl).overflowY==='auto';

/* ---------- HUD (drops from the Dynamic Island) & action sheet ---------- */
let hudT;
function hud(msg,o){
  o=o||{};const h=$('#hud');
  h.innerHTML=`<span class="hud-ic">${icon(o.icon==='warn'?'warn':'checkmark',18,2.2)}</span><span>${esc(msg)}</span>${o.action?`<button type="button" id="hud-act">${esc(o.action)}</button>`:''}`;
  if(o.icon==='warn')h.querySelector('.hud-ic').style.color='#ff9f0a';
  if(o.action)$('#hud-act').onclick=()=>{h.classList.remove('show');o.fn()};
  h.classList.add('show');clearTimeout(hudT);hudT=setTimeout(()=>h.classList.remove('show'),o.action?4500:2200);
}
function sheet(o){
  return new Promise(res=>{
    sheetEl.innerHTML=`<div class="scrim"></div><div class="asheet" role="dialog" aria-modal="true"><div class="ag glass"><div class="am"><b>${esc(o.title)}</b>${esc(o.msg||'')}</div><button type="button" class="aa${o.destructive?' destructive':''}" data-r="1">${esc(o.action)}</button></div><button type="button" class="aa cancel glass" data-r="0">ביטול</button></div>`;
    const sc=sheetEl.querySelector('.scrim'),as=sheetEl.querySelector('.asheet');
    requestAnimationFrame(()=>{sc.classList.add('show');as.classList.add('show')});
    const close=v=>{sc.classList.remove('show');as.classList.remove('show');setTimeout(()=>{sheetEl.innerHTML=''},300);res(v)};
    sc.onclick=()=>close(false);
    as.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>close(b.dataset.r==='1'));
    as.querySelector('.cancel').focus({preventScroll:true});
  });
}
function copy(text){
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();ok?hud('הועתק'):hud('לא הצלחנו להעתיק. סמנו והעתיקו ידנית',{icon:'warn'})};
  try{navigator.clipboard.writeText(text).then(()=>{haptic();hud('הועתק')},fallback)}catch(e){fallback()}
}
// Destructive edits apply at once and offer Undo
function removeWithUndo(key,before,after,msg){db.set(key,after);haptic(12);render();hud(msg||'נמחק',{action:'ביטול',fn:()=>{db.set(key,before);render()}})}

// Pull user, role and timer out of the store (after boot, account switch or a change from another device)
function applyState(){
  S.user=db.get('user',null);S.role=db.get('role',null);
  const nt=db.get('timer',null),j=JSON.stringify(nt);
  if(!nt){if(lastT){clearInterval(tick);T=T0();lastT=''}return}
  if(j===lastT)return;
  lastT=j;T=nt;clearInterval(tick);
  if(T.running){if(T.endAt<=Date.now()){T.running=false;T.left=0}else{T.left=Math.round((T.endAt-Date.now())/1000);startTick()}}
}
function remoteChange(){applyState();if(typing())needRender=true;else render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(needRender&&!typing()){needRender=false;render()}},0));

/* ---------- navigation ---------- */
function go(v,tool,push){
  const from=S.view;
  anim=v==='tool'&&from!=='tool'?'push':from==='tool'&&v!=='tool'&&v==='tools'?'pop':from!==v?'fade':'';
  S.view=v;S.tool=tool||null;S.sub=null;S.edit=false;
  if(push!==false){try{history.pushState({v:v,tool:S.tool},'')}catch(e){}}
  render();screenEl.scrollTop=0;window.scrollTo(0,0);onScroll();
}
window.addEventListener('popstate',e=>{const st=e.state||{v:'home'};go(st.v||'home',st.tool,false)});
try{history.replaceState({v:'home'},'')}catch(e){}
function onScroll(){const nb=$('.navbar');if(!nb)return;const y=isFrame()?screenEl.scrollTop:window.scrollY;nb.classList.toggle('scrolled',y>(nb.classList.contains('inline')?2:44))}
screenEl.addEventListener('scroll',onScroll,{passive:true});window.addEventListener('scroll',onScroll,{passive:true});

  const r=ROLES[S.role];let html;

// calculator: state lives in memory, finished calculations go to history
const C={cur:'0',acc:null,op:null,fresh:true,expr:'',histChanged:false};
const KEYS=[['AC','fn','ניקוי'],['±','fn','החלפת סימן'],['%','fn','אחוז'],['÷','op','חילוק'],['7'],['8'],['9'],['×','op','כפל'],['4'],['5'],['6'],['−','op','חיסור'],['1'],['2'],['3'],['+','op','חיבור'],['0','zero'],['.','','נקודה עשרונית'],['=','op','שווה']];
function calcFmt(s){if(s==='Error')return 'שגיאה';if(/e/.test(s))return s;const neg=s[0]==='-',b=neg?s.slice(1):s,i=b.split('.')[0],d=b.split('.')[1];return (neg?'-':'')+Number(i).toLocaleString('en-US')+(d!==undefined?'.'+d:'')}
function calcRound(x){if(!isFinite(x))return 'Error';const r=parseFloat(x.toPrecision(12));return Math.abs(r)>=1e15||(Math.abs(r)<1e-9&&r!==0)?r.toExponential(6):String(r)}
const calcApply=(a,b,op)=>op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:op==='÷'?(b===0?NaN:a/b):b;
function calcKey(k){
  if(C.cur==='Error'&&k!=='AC'){C.cur='0';C.acc=null;C.op=null;C.fresh=true}
  if(/^[0-9]$/.test(k)){if(C.fresh){C.cur=k;C.fresh=false}else if(C.cur.replace(/[-.]/g,'').length<9)C.cur=C.cur==='0'?k:C.cur==='-0'?'-'+k:C.cur+k}
  else if(k==='.'){if(C.fresh){C.cur='0.';C.fresh=false}else if(C.cur.indexOf('.')<0)C.cur+='.'}
  else if(k==='⌫'){if(!C.fresh){C.cur=C.cur.slice(0,-1);if(C.cur===''||C.cur==='-')C.cur='0'}}
  else if(k==='AC'){if(!C.fresh&&C.cur!=='0'){C.cur='0';C.fresh=true}else{C.cur='0';C.acc=null;C.op=null;C.fresh=true;C.expr=''}}
  else if(k==='±'){C.cur=C.cur[0]==='-'?C.cur.slice(1):'-'+C.cur}
  else if(k==='%'){const v=parseFloat(C.cur);C.cur=calcRound(C.acc!==null&&(C.op==='+'||C.op==='−')?C.acc*v/100:v/100);C.fresh=true}
  else if('+−×÷'.indexOf(k)>-1){
    if(C.op&&!C.fresh)C.cur=calcRound(calcApply(C.acc,parseFloat(C.cur),C.op));
    if(C.cur==='Error'){C.acc=null;C.op=null;return}
    C.acc=parseFloat(C.cur);C.op=k;C.fresh=true;C.expr=calcFmt(C.cur)+' '+k;
  }
  else if(k==='='){
    if(C.op===null)return;
    const b=C.cur,r=calcRound(calcApply(C.acc,parseFloat(b),C.op)),e=calcFmt(calcRound(C.acc))+' '+C.op+' '+calcFmt(b);
    C.expr=e+' =';C.cur=r;C.acc=null;C.op=null;C.fresh=true;
    if(r!=='Error'){const h=db.get('calc.hist',[]);h.unshift({e:e,v:r});db.set('calc.hist',h.slice(0,12));C.histChanged=true}
  }
}

  palette:{name:'מחולל פלטות',icon:'palette',color:'--c-pink',sub:'5 צבעים בלחיצה',view(){const p=getPal();
    return `<div class="palette">${p.cols.map((c,i)=>`<div class="sw" style="background:${c};color:${ink(c)}"><button class="sw-hex" data-a="pal-copy" data-v="${c}" aria-label="העתקת ${c}">${c.toUpperCase()}</button><button class="sw-lock" data-a="pal-lock" data-i="${i}" aria-pressed="${!!p.locks[i]}" aria-label="נעילת צבע">${icon(p.locks[i]?'lock':'unlock',20)}</button></div>`).join('')}</div>
    <p class="section-f">הקישו על קוד כדי להעתיק. מנעול שומר צבע בפלטה הבאה.</p>
    <div class="btn-row"><button class="btn filled" data-a="pal-gen">${icon('sparkles',18)} פלטה חדשה</button><button class="btn" data-a="pal-copyall">${icon('copy',18)} כל הקודים</button></div>`}},

  contrast:{name:'בודק ניגודיות',icon:'contrast',color:'--c-gray',sub:'WCAG AA / AAA',view(){const d=getContrast();
    const pick=(k,l)=>`<div class="field"><input type="color" class="well" id="c-${k}p" value="${d[k]}" data-in="contrast" data-k="${k}" aria-label="בחירת ${l}"><label for="c-${k}">${l}</label><input id="c-${k}" value="${d[k]}" dir="ltr" maxlength="7" autocapitalize="off" spellcheck="false" data-in="contrast" data-k="${k}" class="mono" style="text-align:left"></div>`;
    return `<div class="list">${pick('fg','טקסט')}${pick('bg','רקע')}<button class="row blue" data-a="c-swap">${icon('swap',18)} החלפה בין הצבעים</button></div>
    <div id="c-res"></div>`},after:updContrast},

  units:{name:'ממיר px ↔ rem',icon:'ruler',color:'--c-teal',sub:'לפי גודל בסיס',view(){const base=db.get('base',16);
    return `<div class="list"><div class="field"><label for="u-px">פיקסלים</label><input id="u-px" type="number" inputmode="decimal" value="24" data-in="u-px" dir="ltr" style="text-align:left"></div><div class="field"><label for="u-rem">rem</label><input id="u-rem" type="number" inputmode="decimal" step="0.0625" data-in="u-rem" dir="ltr" style="text-align:left"></div></div>
    <div class="section-h">גודל בסיס</div><div class="list"><div class="field"><label for="u-base">px</label><input id="u-base" type="number" inputmode="decimal" min="1" value="${base}" data-in="u-base" dir="ltr" style="text-align:left"></div></div>
    <div class="section-h">טבלה מהירה</div><div class="list" id="u-tbl"></div>`},after(){updUnits('px')}},

  picker:{name:'הגרלת תלמיד',icon:'dice',color:'--c-red',sub:'בלי חזרות עד שכולם נבחרו',view(){const names=classNames(),picked=db.get('picked',[]).filter(n=>names.indexOf(n)>-1);
    return `<div class="pick-card"><div class="eyebrow">התור של</div><div class="pick-name" id="pick-out" aria-live="polite">${esc(picked[picked.length-1]||'—')}</div>
      <button class="btn filled" data-a="pick" style="min-width:180px">${icon('dice',20)} הגרלה</button><p class="sub" style="color:var(--label2);font-size:13px" id="pick-left">${names.length-picked.length} מתוך ${names.length} עוד לא נבחרו בסבב</p></div>
    <div class="section-h">רשימת הכיתה</div>
    <div class="list"><div class="field stack"><label for="class-list">שם בכל שורה</label><textarea id="class-list" rows="8" data-in="class">${esc(names.join('\n'))}</textarea></div><button class="row blue" data-a="pick-reset">התחלת סבב חדש</button></div>
    <p class="section-f">רשימה לדוגמה. החליפו בשמות התלמידים שלכם.</p>`}},

  groups:{name:'חלוקה לקבוצות',icon:'users',color:'--c-green',sub:'אקראית ומאוזנת',view(){const n=db.get('gcount',3),g=db.get('groups',null);
    return `<div class="list"><div class="row"><span class="body t">מספר קבוצות: <b id="g-n">${n}</b></span><span class="stepper"><button data-a="g-step" data-v="-1" aria-label="פחות">−</button><button data-a="g-step" data-v="1" aria-label="יותר">+</button></span></div></div>
    <p class="section-f">משתמש ברשימת הכיתה מכלי ההגרלה (${classNames().length} תלמידים).</p>
    <div class="btn-row"><button class="btn filled" data-a="g-make">${icon('users',20)} חלוקה</button></div>
    ${g?g.map((m,i)=>`<div class="section-h">קבוצה ${i+1} · ${m.length}</div><div class="list">${m.map(x=>`<div class="row"><span class="body t">${esc(x)}</span></div>`).join('')}</div>`).join(''):''}`}},

  grades:{name:'מחשבון ציונים',icon:'calc',color:'--c-indigo',sub:'ממוצע משוקלל',edit:true,view(){const rows=getGrades();
    return `<div class="pick-card"><div class="eyebrow">ממוצע משוקלל</div><div class="big-num" id="g-avg">—</div><p style="color:var(--label2);font-size:13px" id="g-sum"></p></div>
    <div class="section-h" style="padding-bottom:0"></div><div class="grade-h"><span></span><span>רכיב</span><span>ציון</span><span>משקל %</span></div>
    <div class="list">${rows.map((r,i)=>`<div class="grade-row"><button class="minus" style="display:grid;${S.edit?'':'visibility:hidden'}" data-a="g-del" data-i="${i}" aria-label="מחיקת רכיב">${icon('minus',14)}</button><input class="nm" aria-label="שם הרכיב" value="${esc(r.n)}" data-in="grade" data-i="${i}" data-k="n"><input aria-label="ציון" type="number" inputmode="decimal" min="0" max="100" value="${esc(r.g)}" data-in="grade" data-i="${i}" data-k="g" dir="ltr"><input aria-label="משקל" type="number" inputmode="decimal" min="0" value="${esc(r.w)}" data-in="grade" data-i="${i}" data-k="w" dir="ltr"></div>`).join('')}
      <button class="row blue" data-a="g-add">${icon('plus',18,2.4)} הוספת רכיב</button></div>
    <p class="section-f">לחצו "עריכה" כדי למחוק רכיבים.</p>`},after:updGrades},

  shopping:{name:'רשימת קניות',icon:'cart',color:'--c-green',sub:'להעתקה ולשליחה',edit:true,view(){const items=getShop().map((x,i)=>Object.assign({i:i},x)).sort((a,b)=>a.d-b.d),left=items.filter(x=>!x.d).length;
    return `<div class="section-h" style="padding-top:4px">לקנות · ${left}</div>
    <div class="list checks">${items.map(x=>checkRow(x,x.i,'shop-toggle','shop-del')).join('')}
      <form id="shop-add" class="add-row"><span class="plus">${icon('plus',16,2.6)}</span><input id="shop-in" placeholder="פריט חדש" aria-label="פריט חדש" enterkeyhint="done"></form></div>
    <div class="btn-row"><button class="btn filled" data-a="shop-copy">${icon('copy',18)} העתקה לשליחה</button><button class="btn" data-a="shop-clear">ניקוי שנקנו</button></div>`}},

  chores:{name:'מטלות וכוכבים',icon:'star',color:'--c-yellow',sub:'לכל ילד וילדה',edit:true,view(){const c=getChores();
    return `${c.kids.map((k,ki)=>{const mine=c.list.map((x,i)=>Object.assign({i:i},x)).filter(x=>x.k===ki),stars=mine.filter(x=>x.d).length;
      return `<div class="section-h" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:20px;font-weight:700;color:var(--label)">${esc(k)}</span><span class="stars">${icon('star',16)} ${stars}</span></div>
        <div class="list checks">${mine.map(x=>checkRow(x,x.i,'ch-toggle','ch-del')).join('')||'<div class="row"><span class="body sub">אין מטלות כרגע.</span></div>'}</div>`}).join('')}
    <div class="section-h">מטלה חדשה</div>
    <form id="chore-add" class="list"><div class="field"><label for="ch-t">מטלה</label><input id="ch-t" placeholder="להוציא את הזבל"></div><div class="field"><label for="ch-k">למי</label><select id="ch-k">${c.kids.map((k,i)=>`<option value="${i}">${esc(k)}</option>`).join('')}</select></div><button class="row blue">${icon('plus',18,2.4)} הוספת מטלה</button></form>
    <div class="section-h">ילד/ה נוסף/ת</div>
    <form id="kid-add" class="list"><div class="add-row"><span class="plus">${icon('plus',16,2.6)}</span><input id="kid-in" placeholder="שם" aria-label="שם הילד"></div></form>
    <div class="section-h"></div><div class="list"><button class="row blue" data-a="ch-reset">שבוע חדש: איפוס הסימונים</button></div>`}},

  meals:{name:'תפריט שבועי',icon:'meal',color:'--c-red',sub:'ארוחות ערב לכל השבוע',view(){const m=getMeals(),td=new Date().getDay();
    return `<div class="list">${DAYS.map((d,i)=>`<div class="field meal${i===td?' today':''}"><label class="day" for="meal-${i}">${d}${i===td?'<span class="today-dot">היום</span>':''}</label><input id="meal-${i}" value="${esc(m[i])}" placeholder="מה אוכלים?" data-in="meal" data-i="${i}"></div>`).join('')}</div>
    <div class="btn-row"><button class="btn filled" data-a="meal-copy">${icon('copy',18)} העתקת התפריט</button></div>`}},

  /* ----- general tools (every role) ----- */
  calc:{name:'מחשבון',icon:'calc',color:'--c-gray',sub:'חשבון מהיר עם היסטוריה',view(){const h=db.get('calc.hist',[]);
    return `<div class="calc-disp" aria-live="polite"><div class="calc-expr" id="calc-expr"></div><div class="calc-num" id="calc-num">0</div></div>
    <div class="keys">${KEYS.map(k=>`<button class="key ${k[1]||''}" data-a="ck" data-k="${k[0]}" aria-label="${k[2]||k[0]}">${k[0]}</button>`).join('')}</div>
    ${h.length?`<div class="section-h">היסטוריה</div><div class="list">${h.map((x,i)=>`<button class="row" data-a="calc-use" data-i="${i}"><span class="body sub" dir="ltr" style="text-align:right;font-size:15px">${esc(x.e)} =</span><span class="t" dir="ltr" style="font-variant-numeric:tabular-nums;font-weight:600">${esc(calcFmt(x.v))}</span></button>`).join('')}<button class="row blue" data-a="calc-clear">ניקוי ההיסטוריה</button></div><p class="section-f">הקישו על תוצאה כדי להמשיך לחשב ממנה. אפשר גם להקליד במקלדת.</p>`:''}`},after:calcSync},

  notes:{name:'פתקים',icon:'note',color:'--c-yellow',sub:'רעיונות, רשימות ומחשבות',
    trail(){return S.sub?`<button class="nb-btn bold" data-a="note-done">סיום</button>`:`<button class="nb-btn" data-a="note-new" aria-label="פתק חדש">${icon('compose',24)}</button>`},
    view(){
      if(S.sub){const n=getNotes().find(x=>x.id===S.sub);
        if(n)return `<div class="note-meta">${esc(new Date(n.u).toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'}))} · ${hhmm(n.u)}</div><textarea id="note-body" class="note-ed" data-in="note" placeholder="כתבו משהו…" aria-label="תוכן הפתק">${esc(n.b)}</textarea>`;
        S.sub=null}
      const l=getNotes().sort((a,b)=>b.u-a.u);
      return l.length?`<div class="section-h" style="padding-top:4px">${l.length} פתקים</div><div class="list">${l.map(n=>{const lines=n.b.split('\n').filter(x=>x.trim());
        return swipeRow(`<button class="body" data-a="note-open" data-v="${esc(n.id)}" style="text-align:start;padding:4px 0"><span class="t" style="font-weight:600;display:block">${esc(lines[0]||'פתק חדש')}${n.ex?'<span class="tag">דוגמה</span>':''}</span><span class="sub" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${noteDate(n.u)}  ${esc(lines.slice(1).join(' · ')||'אין טקסט נוסף')}</span></button>`,'note-del',esc(n.id))}).join('')}</div>
      <p class="section-f">החליקו פתק הצידה כדי למחוק.</p>`
      :`<div class="pick-card" style="margin-top:20px"><span style="color:var(--c-yellow)">${icon('note',44)}</span><b>אין פתקים</b><p style="color:var(--label2);font-size:15px">הקישו על הכפתור למעלה כדי לכתוב פתק ראשון.</p></div>`}},

  habits:{name:'הרגלים',icon:'flame',color:'--c-mint',sub:'מעקב יומי ורצפים',edit:true,view(){const hs=getHabits(),k=iso(daysBack(0)),done=hs.filter(h=>h.days[k]).length;
    return `<div class="section-h" style="padding-top:4px">היום · ${done} מתוך ${hs.length}</div>
    <div class="list">${hs.map((h,i)=>{const st=streak(h);return swipeRow(`<span class="body"><span class="t" style="display:flex;justify-content:space-between;gap:8px"><span>${esc(h.n)}</span>${st?`<span class="flame">${icon('flame',15,2)} ${st}</span>`:''}</span><span class="days">${[6,5,4,3,2,1,0].map(b=>{const d=daysBack(b),dk=iso(d);return `<button class="dayc${h.days[dk]?' on':''}${b===0?' today':''}" data-a="hab-day" data-i="${i}" data-v="${dk}" aria-pressed="${!!h.days[dk]}" aria-label="${b===0?'היום':'יום '+DAYS[d.getDay()]}">${DAYL[d.getDay()]}</button>`}).join('')}</span></span>`,'hab-del',i)}).join('')}
      <form id="hab-add" class="add-row"><span class="plus">${icon('plus',16,2.6)}</span><input id="hab-in" placeholder="הרגל חדש" aria-label="הרגל חדש" enterkeyhint="done"></form></div>
    <p class="section-f">הקישו על יום כדי לסמן אותו. המספר הכתום הוא הרצף הנוכחי בימים.</p>`}},

  countdown:{name:'ספירה לאחור',icon:'calendar',color:'--c-red',sub:'כמה ימים נשארו לאירוע',edit:true,view(){
    const l=getEvents().map((e,i)=>Object.assign({i:i,n2:daysTo(e.d)},e)).sort((a,b)=>(a.n2<0)-(b.n2<0)||Math.abs(a.n2)-Math.abs(b.n2)),def=iso(daysBack(-7));
    return `${l.length?`<div class="list">${l.map(e=>swipeRow(`<span class="cd-n${e.n2<0?' past':''}">${e.n2===0?'היום':Math.abs(e.n2)}${e.n2===0?'':`<span class="cd-u">${e.n2>0?(e.n2===1?'יום':'ימים'):'ימים עברו'}</span>`}</span><span class="body"><span class="t">${esc(e.n)}${e.ex?'<span class="tag">דוגמה</span>':''}</span><span class="sub" style="display:block">${esc(longDate(e.d))}</span></span>`,'ev-del',e.i)).join('')}</div>`:'<div class="pick-card"><b>אין אירועים</b><p style="color:var(--label2);font-size:15px">הוסיפו יום הולדת, חופשה או מבחן.</p></div>'}
    <div class="section-h">אירוע חדש</div>
    <form id="ev-add" class="list"><div class="field"><label for="ev-n">שם</label><input id="ev-n" placeholder="למשל: מבחן במתמטיקה"></div><div class="field"><label for="ev-d">תאריך</label><input id="ev-d" type="date" value="${def}"></div><button class="row blue">${icon('plus',18,2.4)} הוספה</button></form>`}},

  split:{name:'חלוקת חשבון',icon:'receipt',color:'--c-green',sub:'טיפ וחלוקה בין חברים',view(){const r=splitCalc(),s=r.s;
    return `<div class="pick-card"><div class="eyebrow">לכל אחד</div><div class="big-num" id="sp-per">${money(r.per)}</div><p style="color:var(--label2);font-size:15px" id="sp-sum">סה״כ ${money(r.sum)} · טיפ ${money(r.tip)}</p></div>
    <div class="section-h">החשבון</div>
    <div class="list"><div class="field"><label for="sp-a">סכום ₪</label><input id="sp-a" type="number" inputmode="decimal" min="0" value="${esc(s.a)}" data-in="split" dir="ltr" style="text-align:left"></div>
      <div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><span class="t">טיפ</span><span class="seg" role="group" aria-label="אחוז טיפ">${[0,10,12,15,18].map(t=>`<button class="${s.t===t?'on':''}" data-a="sp-tip" data-v="${t}" aria-pressed="${s.t===t}">${t}%</button>`).join('')}</span></div>
      <div class="row"><span class="body t">סועדים: <b>${s.p}</b></span><span class="stepper"><button data-a="sp-p" data-v="-1" aria-label="פחות">−</button><button data-a="sp-p" data-v="1" aria-label="יותר">+</button></span></div></div>
    <div class="btn-row"><button class="btn filled" data-a="sp-copy">${icon('copy',18)} העתקה לקבוצה</button></div>`}}
};

/* ---------- actions ---------- */
const A={
  nav:b=>{if(b.dataset.v!==S.view||S.view==='tool')go(b.dataset.v)},
  back:()=>{if(S.sub)A['note-done']();else go('tools')},
  edit:()=>{S.edit=!S.edit;haptic();render()},
  'open-tool':b=>go('tool',b.dataset.v),
  'pick-role':b=>{const v=b.dataset.v,was=S.role;S.role=v;db.set('role',v);haptic();if(was&&was!==v)hud(`עברת למצב ${ROLES[v].title}`);go('home')},
  'acct-switch':b=>{useLocal(b.dataset.v);clearInterval(tick);T=T0();lastT='';applyState();go('home')},
  'ask-logout':async()=>{if(await sheet({title:'להתנתק?',msg:db.mode==='cloud'?'הנתונים יישארו שמורים בענן.':'הנתונים יישארו במכשיר ותוכלו לחזור לחשבון.',action:'התנתקות'}))A['do-logout']()},
  'ask-wipe':async()=>{if(await sheet({title:'למחוק את כל הנתונים?',msg:'כל המשימות, הרשימות וההגדרות של החשבון יימחקו. אי אפשר לבטל את זה.',action:'מחיקת כל הנתונים',destructive:true}))A['do-wipe']()},
  'do-logout':()=>{
    if(db.mode==='cloud'){db.remove('user')}else{LS.del('yomi.current');db.acct=null;db.cache={};clearInterval(tick);T=T0();lastT=''}
    applyState();go('home')},
  'do-wipe':async()=>{clearInterval(tick);await db.wipeAll();T=T0();lastT='';applyState();go('home');hud('כל הנתונים נמחקו')},
  'task-toggle':b=>{const t=getTasks(),i=+b.dataset.i;t[i].d=!t[i].d;db.set('tasks.'+S.role,t);haptic();render()},
  'task-del':b=>{const t=getTasks(),before=clone(t);t.splice(+b.dataset.i,1);removeWithUndo('tasks.'+S.role,before,t,'התזכורת נמחקה')},
  't-toggle':()=>{
    if(T.running){T.left=Math.max(0,Math.round((T.endAt-Date.now())/1000));T.running=false;clearInterval(tick)}
    else{if(T.left<=0)T.left=T.total;T.endAt=Date.now()+T.left*1000;T.running=true;startTick();
      try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
    haptic();saveT();render()},
  't-reset':()=>{T.running=false;T.left=T.total;clearInterval(tick);saveT();render()},
  't-set':b=>{clearInterval(tick);T={total:+b.dataset.m*60,left:+b.dataset.m*60,running:false,endAt:0,label:b.dataset.l};haptic();saveT();render()},
  'st-copy':()=>copy(standupText(getStandup())),
  'st-clear':()=>{const before=getStandup();removeWithUndo('standup',before,{y:'',t:'',b:''},'הסטנדאפ נוקה')},
  'json-fmt':()=>{const el=$('#json-in');try{el.value=JSON.stringify(JSON.parse(el.value),null,2);db.set('json',el.value)}catch(e){}checkJson()},
  'json-min':()=>{const el=$('#json-in');try{el.value=JSON.stringify(JSON.parse(el.value));db.set('json',el.value)}catch(e){}checkJson()},
  'json-copy':()=>copy($('#json-in').value),
  'snip-copy':b=>copy(getSnips()[+b.dataset.i].c),
  'snip-del':b=>{const l=getSnips(),before=clone(l);l.splice(+b.dataset.i,1);removeWithUndo('snippets',before,l,'הסניפט נמחק')},
  'pal-gen':()=>{const p=getPal(),h=Math.random()*360,mode=Math.floor(Math.random()*3),
    offs=[[0,15,30,-25,190],[0,180,20,200,10],[0,120,240,60,0]][mode],ls=[20,36,52,70,93],ss=[40,60,68,72,35];
    p.cols=p.cols.map((c,i)=>p.locks[i]?c:hsl2hex((h+offs[i]+360)%360,ss[i]+Math.random()*15,ls[i]));db.set('palette',p);haptic();render()},
  'pal-lock':b=>{const p=getPal(),i=+b.dataset.i;p.locks[i]=p.locks[i]?0:1;db.set('palette',p);haptic();render()},
  'pal-copy':b=>copy(b.dataset.v.toUpperCase()),
  'pal-copyall':()=>copy(getPal().cols.map(c=>c.toUpperCase()).join(', ')),
  'c-swap':()=>{const d=getContrast();db.set('contrast',{fg:d.bg,bg:d.fg});render()},
  pick:()=>{const names=classNames();if(!names.length){hud('הוסיפו שמות לרשימת הכיתה',{icon:'warn'});return}
    let picked=db.get('picked',[]).filter(n=>names.indexOf(n)>-1);if(picked.length>=names.length)picked=[];
    const pool=names.filter(n=>picked.indexOf(n)<0),choice=pool[Math.floor(Math.random()*pool.length)],out=$('#pick-out'),t0=Date.now();
    const spin=setInterval(()=>{out.textContent=names[Math.floor(Math.random()*names.length)];haptic(4);if(Date.now()-t0>700){clearInterval(spin);out.textContent=choice;haptic(20);picked.push(choice);db.set('picked',picked);
      const l=$('#pick-left');if(l)l.textContent=`${names.length-picked.length} מתוך ${names.length} עוד לא נבחרו בסבב`}},70)},
  'pick-reset':()=>{db.set('picked',[]);render();hud('סבב חדש התחיל')},
  'g-step':b=>{const n=Math.min(12,Math.max(2,db.get('gcount',3)+ +b.dataset.v));db.set('gcount',n);haptic();$('#g-n').textContent=n},
  'g-make':()=>{const n=db.get('gcount',3),g=Array.from({length:n},()=>[]);shuffle(classNames()).forEach((x,i)=>g[i%n].push(x));db.set('groups',g);haptic();render()},
  'g-add':()=>{const r=getGrades();r.push({n:'רכיב חדש',g:'',w:10});db.set('grades',r);render()},
  'g-del':b=>{const r=getGrades(),before=clone(r);r.splice(+b.dataset.i,1);removeWithUndo('grades',before,r,'הרכיב נמחק')},
  'shop-toggle':b=>{const l=getShop(),i=+b.dataset.i;l[i].d=l[i].d?0:1;db.set('shop',l);haptic();render()},
  'shop-del':b=>{const l=getShop(),before=clone(l);l.splice(+b.dataset.i,1);removeWithUndo('shop',before,l,'הפריט נמחק')},
  'shop-copy':()=>copy(shopText()),
  'shop-clear':()=>{const l=getShop();if(!l.some(x=>x.d)){hud('אין פריטים מסומנים',{icon:'warn'});return}removeWithUndo('shop',l,l.filter(x=>!x.d),'הפריטים שנקנו נוקו')},
  'ch-toggle':b=>{const c=getChores(),i=+b.dataset.i;c.list[i].d=c.list[i].d?0:1;db.set('chores',c);haptic();render();if(c.list[i].d)hud(`כוכב ל${c.kids[c.list[i].k]}!`)},
  'ch-del':b=>{const c=getChores(),before=clone(c);c.list.splice(+b.dataset.i,1);removeWithUndo('chores',before,c,'המטלה נמחקה')},
  'ch-reset':()=>{const c=getChores(),before=clone(c);c.list.forEach(x=>x.d=0);removeWithUndo('chores',before,c,'שבוע חדש התחיל')},
  'meal-copy':()=>copy(mealText()),
  ck:b=>pressCalc(b.dataset.k),
  'calc-use':b=>{const h=db.get('calc.hist',[])[+b.dataset.i];if(!h)return;C.cur=h.v;C.acc=null;C.op=null;C.fresh=true;C.expr=h.e+' =';haptic();calcSync();screenEl.scrollTop=0;window.scrollTo(0,0)},
  'calc-clear':()=>{const h=db.get('calc.hist',[]);removeWithUndo('calc.hist',h,[],'ההיסטוריה נוקתה')},
  'note-new':()=>{const l=getNotes(),id='n'+Date.now().toString(36);l.push({id:id,b:'',u:Date.now()});db.set('notes',l);S.sub=id;anim='push';render();const t=$('#note-body');if(t)t.focus()},
  'note-open':b=>{S.sub=b.dataset.v;anim='push';render()},
  'note-done':()=>{const l=getNotes(),n=l.find(x=>x.id===S.sub);if(n&&!n.b.trim())db.set('notes',l.filter(x=>x!==n));S.sub=null;anim='pop';render()},
  'note-del':b=>{const l=getNotes();removeWithUndo('notes',l,l.filter(x=>x.id!==b.dataset.i),'הפתק נמחק')},
  'hab-day':b=>{const hs=getHabits(),h=hs[+b.dataset.i],k=b.dataset.v;if(h.days[k])delete h.days[k];else h.days[k]=1;db.set('habits',hs);haptic();render();
    const t=iso(daysBack(0));if(k===t&&h.days[k]&&hs.every(x=>x.days[t]))hud('כל ההרגלים של היום הושלמו!')},
  'hab-del':b=>{const hs=getHabits(),before=clone(hs);hs.splice(+b.dataset.i,1);removeWithUndo('habits',before,hs,'ההרגל נמחק')},
  'ev-del':b=>{const l=getEvents(),before=clone(l);l.splice(+b.dataset.i,1);removeWithUndo('events',before,l,'האירוע נמחק')},
  'sp-tip':b=>{const s=getSplit();s.t=+b.dataset.v;db.set('split',s);haptic();render()},
  'sp-p':b=>{const s=getSplit();s.p=Math.min(50,Math.max(1,s.p+ +b.dataset.v));db.set('split',s);haptic();render()},
  'sp-copy':()=>{const r=splitCalc();copy(`חשבון של ${money(r.sum)} (כולל טיפ ${r.s.t}%) לחלק ל-${r.s.p}: ${money(r.per)} לכל אחד`)}
};

const F={
  login:()=>{const name=$('#l-name').value.trim(),email=$('#l-email').value.trim(),err=$('#l-err');
    if(!name){err.textContent='כתבו את השם שלכם כדי להמשיך.';err.hidden=false;$('#l-name').focus();return}
    if(email&&!/^\S+@\S+\.\S+$/.test(email)){err.textContent='כתובת האימייל לא נראית תקינה. אפשר גם להשאיר ריק.';err.hidden=false;return}
    if(db.mode!=='cloud')createLocal(name);
    db.set('user',{name:name,email:email});applyState();anim='push';go('home')},
  'task-add':()=>{const v=$('#task-in').value.trim();if(!v)return;const t=getTasks();t.push({t:v,d:false});db.set('tasks.'+S.role,t);render();$('#task-in').focus()},
  't-custom':()=>{const m=parseInt($('#t-min').value,10);if(!(m>0)){hud('כתבו מספר דקות',{icon:'warn'});return}clearInterval(tick);T={total:m*60,left:m*60,running:false,endAt:0,label:`${m} דקות`};saveT();render()},
  'snip-add':()=>{const t=$('#sn-t').value.trim(),c=$('#sn-c').value;if(!c.trim()){hud('הוסיפו קוד לסניפט',{icon:'warn'});return}const l=getSnips();l.unshift({t:t||'ללא שם',c:c});db.set('snippets',l);render();hud('נשמר')},
  'shop-add':()=>{const v=$('#shop-in').value.trim();if(!v)return;const l=getShop();l.unshift({t:v,d:0});db.set('shop',l);render();$('#shop-in').focus()},
  'chore-add':()=>{const t=$('#ch-t').value.trim();if(!t){$('#ch-t').focus();return}const c=getChores();c.list.push({t:t,k:+$('#ch-k').value,d:0});db.set('chores',c);render();hud('המטלה נוספה')},
  'kid-add':()=>{const v=$('#kid-in').value.trim();if(!v)return;const c=getChores();c.kids.push(v);db.set('chores',c);render()},
  'hab-add':()=>{const v=$('#hab-in').value.trim();if(!v)return;const hs=getHabits();hs.push({n:v,days:{}});db.set('habits',hs);render();$('#hab-in').focus()},
  'ev-add':()=>{const n=$('#ev-n').value.trim(),d=$('#ev-d').value;if(!n){$('#ev-n').focus();return}if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){hud('בחרו תאריך',{icon:'warn'});return}
    const l=getEvents();l.push({n:n,d:d});db.set('events',l);render();hud('האירוע נוסף')}
};

const IN={
  standup:el=>{const d=getStandup();d[el.dataset.k]=el.value;db.set('standup',d);$('#st-out').textContent=standupText(d)},
  json:el=>{db.set('json',el.value);checkJson()},
  contrast:el=>{let v=el.value.trim();if(v&&v[0]!=='#')v='#'+v;if(!isHex(v))return;const k=el.dataset.k,d=getContrast();d[k]=v.toLowerCase();db.set('contrast',d);
    const a=$('#c-'+k),b=$('#c-'+k+'p');if(a!==el)a.value=d[k];if(b!==el)b.value=d[k];updContrast()},
  'u-base':el=>{const v=parseFloat(el.value);if(v>0)db.set('base',v);updUnits('px')},
  'u-px':()=>updUnits('px'),
  'u-rem':()=>updUnits('rem'),
  class:el=>{db.set('class',el.value)},
  grade:el=>{const r=getGrades(),i=+el.dataset.i;r[i][el.dataset.k]=el.value;db.set('grades',r);updGrades()},
  meal:el=>{const m=getMeals();m[+el.dataset.i]=el.value;db.set('meals',m)},
  note:el=>{const l=getNotes(),n=l.find(x=>x.id===S.sub);if(!n)return;n.b=el.value;n.u=Date.now();delete n.ex;db.set('notes',l)},
  split:el=>{const s=getSplit();s.a=el.value;db.set('split',s);updSplit()}
};

document.addEventListener('click',e=>{if(suppressClick){e.preventDefault();return}const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){if(b.tagName==='BUTTON'&&b.closest('form')&&!b.getAttribute('type'))e.preventDefault();A[b.dataset.a](b)}},true);
document.addEventListener('submit',e=>{e.preventDefault();const f=F[e.target.id];if(f)f(e.target)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el)});
const CALC_KEYS={'*':'×','x':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Escape':'AC','Delete':'AC','%':'%','.':'.',',':'.','Backspace':'⌫'};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const c=sheetEl.querySelector('.cancel');if(c){c.click();return}}
  if(S.view==='tool'&&S.tool==='calc'&&!typing()&&!e.ctrlKey&&!e.metaKey){const k=/^[0-9]$/.test(e.key)?e.key:CALC_KEYS[e.key];if(k){e.preventDefault();pressCalc(k)}}
});

/* ---------- status bar clock ---------- */
function clock(){const el=$('#sb-time');if(el){const d=new Date();el.textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}}
clock();setInterval(clock,30000);

// Offline support when served from the website (the Android app loads the same site)
if('serviceWorker' in navigator&&/\.github\.io$/.test(location.hostname)){try{navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){}}

/* ---------- boot ---------- */
function ready(){S.booting=false;applyState();anim='fade';render()}
function startLocal(){
  db.mode='local';const cur=LS.get('yomi.current');
  if(cur&&localAccounts().some(a=>a.id===cur))useLocal(cur);
  setStatus('local');ready();
}
function startCloud(){
  let first=true;
  const wait=setTimeout(()=>{db.offline=true;setStatus('offline');if(first){first=false;hud('אין חיבור לענן כרגע. השינויים יישמרו כשיחזור.',{icon:'warn'});ready()}},10000);
  try{
    unsub=db.cloud.collection('data/users/'+db.uid).onSnapshot(snap=>{
      let changed=false;
      snap.docs.forEach(d=>{const k=d.id;if(db.pending[k]||db.busy[k])return;const b=d.data()||{};if(!same(b.v,db.cache[k])){db.cache[k]=clone(b.v);changed=true}});
      snap.docChanges().forEach(c=>{const k=c.doc.id;if(c.type==='removed'&&!db.pending[k]&&!db.busy[k]&&k in db.cache){delete db.cache[k];changed=true}});
      if(!snap.metadata.fromCache){clearTimeout(wait);db.offline=false;refreshStatus()}
      if(first){first=false;ready();return}
      if(changed)remoteChange();
    },()=>{clearTimeout(wait);db.offline=true;setStatus('offline');if(first){first=false;ready()}});
  }catch(e){clearTimeout(wait);startLocal()}
}
async function boot(){
  render();
  let cdb=null,usr=null,me=null;
  if(!window.Capacitor&&window.claude&&typeof window.claude.use==='function'){
    try{const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);cdb=r[0];usr=r[1]}catch(e){}
    if(cdb&&usr){try{me=await usr.me()}catch(e){}}
  }
  if(me&&me.id){db.mode='cloud';db.cloud=cdb;db.uid=me.id;S.cloudName=me.name||'';setStatus('ok');startCloud();return}
  startLocal();
}
boot();
})();
